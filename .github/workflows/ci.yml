name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://domma:domma@127.0.0.1:5432/domma_test
      TEST_DATABASE_URL: postgres://domma_app:domma_app@127.0.0.1:5432/domma_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preparar o banco de testes
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "create role domma login password 'domma' createrole" \
            -c "create role domma_app login password 'domma_app'" \
            -c "create database domma_test owner domma"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
